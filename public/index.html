<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI News Story Generator</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f9fafb;
            color: #222;
            max-width: 700px;
            margin: 0 auto;
            padding: 32px 16px 48px 16px;
        }
        h1 {
            text-align: center;
            color: #2d5be3;
            margin-bottom: 32px;
        }
        button, .copy-button {
            background: #2d5be3;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-size: 1.1em;
            margin: 12px 0;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(45,91,227,0.08);
            transition: background 0.15s;
        }
        button:hover, .copy-button:hover {
            background: #1846b1;
        }
        #newsContainer {
            margin-top: 24px;
        }
        .news-item {
            background: #fff;
            border-radius: 8px;
            border: 1px solid #e3e7ef;
            padding: 28px 24px 16px 24px;
            margin-bottom: 32px;
            box-shadow: 0 2px 16px rgba(45,91,227,0.06);
        }
        .news-item h1, .news-item h2, .news-item h3 {
            color: #2d5be3;
            margin-top: 0;
        }
        .news-item p {
            font-size: 1.15em;
            line-height: 1.7;
            margin: 12px 0;
        }
        .news-item ul {
            margin: 12px 0 12px 20px;
        }
        .news-item li {
            font-size: 1.08em;
            margin-bottom: 8px;
        }
        .copy-button {
            float: right;
            margin-top: 0;
            margin-bottom: 0;
        }
        @media (max-width: 600px) {
            body { padding: 8px; }
            .news-item { padding: 16px 8px; }
        }
    </style>
</head>
<body>
    <h1>AI News Story Generator</h1>
    <button id="generateButton">Generate News Story</button>
    <div id="newsContainer"></div>

    <script>
        const generateButton = document.getElementById('generateButton');
        const newsContainer = document.getElementById('newsContainer');

        generateButton.addEventListener('click', async () => {
            try {
                const response = await fetch('/generate-news', { method: 'POST' });
                const data = await response.json();

                const newsItem = document.createElement('div');
                newsItem.className = 'news-item';
                newsItem.innerHTML = data.htmlContent;

                const copyButton = document.createElement('button');
                copyButton.textContent = 'Copy HTML';
                copyButton.className = 'copy-button';
                copyButton.addEventListener('click', () => {
                    navigator.clipboard.writeText(data.htmlContent)
                        .then(() => alert('HTML copied to clipboard!'))
                        .catch(err => console.error('Failed to copy: ', err));
                });

                newsItem.appendChild(copyButton);
                newsContainer.prepend(newsItem);
            } catch (error) {
                console.error('Error:', error);
                alert('An error occurred while generating the news story.');
            }
        });
    </script>
    <script src="main.js"></script>
</body>
</html>
